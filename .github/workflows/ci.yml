name: TIMI UA/NSTEMI tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install distribution and test requirements
        run: python -m pip install -e ".[dev]"
      - name: Compile Python files
        run: python -m compileall -q timi_nstemi.py cli.py agents enrichment.py simulator.py
      - name: Run tests
        run: python -m pytest -q

  browser:
    name: Browser engine tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check web/timi.mjs
          node --check web/app.mjs
      - name: Test browser score and CSV logic
        run: node --test tests/timi-web.test.mjs
